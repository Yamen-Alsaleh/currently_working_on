[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "RAG system over the vLLM codebase, built for the 42 RAG project."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "fire>=0.6.0",
    "tqdm>=4.66.0",
    "rank-bm25>=0.2.2",
    "transformers>=4.51.0",
    "torch>=2.2.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
