[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling via constrained decoding with a small LLM"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
    "llm-sdk",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=1.17.0",
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
exclude = "^(llm_sdk|tests)/"
python_version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
